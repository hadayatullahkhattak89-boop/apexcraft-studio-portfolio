<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <!-- Facet 1 Gradient (Left Ascent) -->
    <linearGradient id="full-apex-left" x1="10" y1="56" x2="32" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="60%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Facet 2 Gradient (Right Ascent) -->
    <linearGradient id="full-apex-right" x1="32" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Facet 3 Gradient (Inner Core) -->
    <linearGradient id="full-apex-core" x1="20" y1="38" x2="44" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="text-craft-grad" x1="140" y1="20" x2="220" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <filter id="full-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Geometric Brand Emblem (Left) -->
  <g transform="translate(4, 2)">
    <!-- Hexagonal Aura Frame -->
    <polygon points="30,4 54,18 54,44 30,58 6,44 6,18" stroke="url(#full-apex-right)" stroke-width="1.2" stroke-opacity="0.3" fill="rgba(10, 16, 38, 0.7)"/>

    <!-- Left Wing (A + Bracket <) -->
    <path d="M30 8L12 50L20 50L30 28L34 37L39 28L30 8Z" fill="url(#full-apex-left)"/>

    <!-- Right Wing (A + Bracket >) -->
    <path d="M30 8L48 50L40 50L30 28L35 18L30 8Z" fill="url(#full-apex-right)"/>

    <!-- Summit Crown Diamond -->
    <polygon points="30,8 25,16 30,22 35,16" fill="#38bdf8" filter="url(#full-glow)"/>

    <!-- Core Crossbar -->
    <path d="M18 40L27 40L30 33L33 40L42 40L37 46L30 46L23 46L18 40Z" fill="url(#full-apex-core)" filter="url(#full-glow)"/>

    <!-- Dual Anchor Nodes -->
    <circle cx="12" cy="50" r="2.5" fill="#6366f1"/>
    <circle cx="48" cy="50" r="2.5" fill="#06b6d4"/>
  </g>

  <!-- 2. Stylized Brand Typography -->
  <g transform="translate(74, 38)">
    <!-- "Apex" text in bold geometric pure white -->
    <text font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="26" font-weight="800" fill="#f8fafc" letter-spacing="-0.03em">Apex</text>
    
    <!-- "Craft" text in electric purple-cyan gradient -->
    <text x="64" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="26" font-weight="800" fill="url(#text-craft-grad)" letter-spacing="-0.03em">Craft</text>
  </g>

  <!-- 3. Studio Badge Pill (Right side) -->
  <g transform="translate(202, 18)">
    <rect width="66" height="22" rx="11" fill="rgba(6, 182, 212, 0.12)" stroke="rgba(6, 182, 212, 0.35)" stroke-width="1"/>
    <circle cx="10" cy="11" r="2.5" fill="#10b981"/>
    <text x="18" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#38bdf8" letter-spacing="0.16em">STUDIO</text>
  </g>
</svg>
