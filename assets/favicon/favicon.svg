<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="fav-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a1026"/>
      <stop offset="100%" stop-color="#030611"/>
    </linearGradient>
    <linearGradient id="fav-left" x1="12" y1="52" x2="32" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="60%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="fav-right" x1="32" y1="10" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="fav-core" x1="22" y1="42" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container -->
  <rect width="64" height="64" rx="16" fill="url(#fav-bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="url(#fav-right)" stroke-width="1.2" stroke-opacity="0.35"/>

  <!-- Left Wing (A + Bracket <) -->
  <path d="M32 10L14 50L22 50L32 28L36 37L41 28L32 10Z" fill="url(#fav-left)"/>

  <!-- Right Wing (A + Bracket >) -->
  <path d="M32 10L50 50L42 50L32 28L37 18L32 10Z" fill="url(#fav-right)"/>

  <!-- Crown Summit -->
  <polygon points="32,10 27,18 32,24 37,18" fill="#38bdf8" filter="url(#fav-glow)"/>

  <!-- Core Bridge -->
  <path d="M20 40L29 40L32 33L35 40L44 40L39 46L32 46L25 46L20 40Z" fill="url(#fav-core)" filter="url(#fav-glow)"/>

  <!-- Accent Nodes -->
  <circle cx="14" cy="50" r="2.2" fill="#6366f1"/>
  <circle cx="50" cy="50" r="2.2" fill="#06b6d4"/>
</svg>
